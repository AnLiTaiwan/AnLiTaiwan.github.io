<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" font-family="Montserrat,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" aria-label="Metamorphic testing asserts a relation between input and output instead of an exact answer: rephrase a question and the classification should not change; add an irrelevant sentence and the answer should stay the same; translate the input and the sentiment should survive. No single correct answer is needed, which is why it fits generative systems.">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#f7f9fc"></stop></linearGradient>
    <linearGradient id="sc-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1ff"></stop><stop offset="1" stop-color="#ece1ff"></stop></linearGradient>
    <linearGradient id="sc-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecf9f2"></stop><stop offset="1" stop-color="#d8f1e4"></stop></linearGradient>
    <linearGradient id="sc-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b34a8"></stop><stop offset="1" stop-color="#3d2a6b"></stop></linearGradient>
    <filter id="sc-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3d2a6b" flood-opacity="0.13"></feDropShadow></filter>
  </defs>
  <rect width="880" height="360" fill="url(#sc-bg)"></rect>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#3d2a6b">Assert a <tspan fill="#7a4fd0">relation</tspan>, not an exact answer</text>
  <text x="28" y="62" font-size="12.5" fill="#7a8696">perturb the input in a known way · the output must behave a known way</text>

  
  <g font-size="13.5" font-weight="600">
    
    <g filter="url(#sc-sh)"><rect x="28" y="80" width="824" height="58" rx="13" fill="#fff" stroke="#e7e0f4"></rect></g>
    <g filter="url(#sc-sh)"><rect x="44" y="94" width="300" height="30" rx="8" fill="url(#sc-purple)"></rect></g>
    <text x="60" y="114" fill="#5b34a8">Rephrase the question</text>
    <circle cx="440" cy="109" r="16" fill="#fff" stroke="#7a4fd0" stroke-width="2"></circle>
    <text x="440" y="114" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4fd0">≡</text>
    <g filter="url(#sc-sh)"><rect x="536" y="94" width="300" height="30" rx="8" fill="url(#sc-green)"></rect></g>
    <text x="552" y="114" fill="#15734e">classification stays the same</text>

    
    <g filter="url(#sc-sh)"><rect x="28" y="150" width="824" height="58" rx="13" fill="#fff" stroke="#e7e0f4"></rect></g>
    <g filter="url(#sc-sh)"><rect x="44" y="164" width="300" height="30" rx="8" fill="url(#sc-purple)"></rect></g>
    <text x="60" y="184" fill="#5b34a8">Add an irrelevant sentence</text>
    <circle cx="440" cy="179" r="16" fill="#fff" stroke="#7a4fd0" stroke-width="2"></circle>
    <text x="440" y="184" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4fd0">≡</text>
    <g filter="url(#sc-sh)"><rect x="536" y="164" width="300" height="30" rx="8" fill="url(#sc-green)"></rect></g>
    <text x="552" y="184" fill="#15734e">answer stays the same</text>

    
    <g filter="url(#sc-sh)"><rect x="28" y="220" width="824" height="58" rx="13" fill="#fff" stroke="#e7e0f4"></rect></g>
    <g filter="url(#sc-sh)"><rect x="44" y="234" width="300" height="30" rx="8" fill="url(#sc-purple)"></rect></g>
    <text x="60" y="254" fill="#5b34a8">Translate the input</text>
    <circle cx="440" cy="249" r="16" fill="#fff" stroke="#7a4fd0" stroke-width="2"></circle>
    <text x="440" y="254" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4fd0">≡</text>
    <g filter="url(#sc-sh)"><rect x="536" y="234" width="300" height="30" rx="8" fill="url(#sc-green)"></rect></g>
    <text x="552" y="254" fill="#15734e">sentiment survives</text>
  </g>

  
  <g filter="url(#sc-sh)"><rect x="28" y="296" width="824" height="42" rx="12" fill="url(#sc-bar)"></rect></g>
  <text x="440" y="323" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">No single correct answer needed — which is exactly why it fits generative systems.</text>
</svg>