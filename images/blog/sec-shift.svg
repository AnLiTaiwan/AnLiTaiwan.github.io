<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" font-family="Montserrat,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" aria-label="QA used to own user flows, stability, performance and security. A new dimension joins the definition of quality: the quality of the model&#39;s output (text, image, audio, video, domain), because the output is now what the business sells.">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#f7f9fc"></stop></linearGradient>
    <linearGradient id="sa-neutral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fc"></stop><stop offset="1" stop-color="#eef2f8"></stop></linearGradient>
    <linearGradient id="sa-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1ff"></stop><stop offset="1" stop-color="#ece1ff"></stop></linearGradient>
    <linearGradient id="sa-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13283f"></stop><stop offset="1" stop-color="#0f1b2d"></stop></linearGradient>
    <filter id="sa-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#13283f" flood-opacity="0.12"></feDropShadow></filter>
    <marker id="sa-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4fd0"></path></marker>
  </defs>
  <rect width="860" height="320" fill="url(#sa-bg)"></rect>

  
  <g filter="url(#sa-sh)"><rect x="28" y="40" width="300" height="190" rx="16" fill="url(#sa-neutral)" stroke="#cdd8e6"></rect></g>
  <text x="48" y="72" font-size="12" font-weight="700" fill="#48607c" letter-spacing="0.6">WHAT QA ALREADY OWNS</text>
  <g font-size="13" font-weight="600" fill="#3c4d63">
    <g filter="url(#sa-sh)"><rect x="48" y="88" width="124" height="38" rx="9" fill="#fff" stroke="#dde4ee"></rect></g><text x="110" y="112" text-anchor="middle">User flows</text>
    <g filter="url(#sa-sh)"><rect x="184" y="88" width="124" height="38" rx="9" fill="#fff" stroke="#dde4ee"></rect></g><text x="246" y="112" text-anchor="middle">Stability</text>
    <g filter="url(#sa-sh)"><rect x="48" y="134" width="124" height="38" rx="9" fill="#fff" stroke="#dde4ee"></rect></g><text x="110" y="158" text-anchor="middle">Performance</text>
    <g filter="url(#sa-sh)"><rect x="184" y="134" width="124" height="38" rx="9" fill="#fff" stroke="#dde4ee"></rect></g><text x="246" y="158" text-anchor="middle">Security</text>
  </g>
  <text x="48" y="208" font-size="12" fill="#7a8696" font-style="italic">stable for years</text>

  
  <g filter="url(#sa-sh)"><circle cx="430" cy="135" r="30" fill="#fff" stroke="#7a4fd0" stroke-width="2.5"></circle></g>
  <line x1="430" y1="120" x2="430" y2="150" stroke="#7a4fd0" stroke-width="4" stroke-linecap="round"></line>
  <line x1="415" y1="135" x2="445" y2="135" stroke="#7a4fd0" stroke-width="4" stroke-linecap="round"></line>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#7a4fd0" font-weight="700">a new dimension</text>

  
  <g filter="url(#sa-sh)"><rect x="532" y="40" width="300" height="190" rx="16" fill="url(#sa-purple)" stroke="#7a4fd0" stroke-width="2" stroke-dasharray="8 6"></rect></g>
  <text x="552" y="72" font-size="12" font-weight="700" fill="#5b34a8" letter-spacing="0.6">THE QUALITY OF MODEL OUTPUT</text>
  <g font-size="12.5" font-weight="600" fill="#3d2a6b">
    <g filter="url(#sa-sh)"><rect x="552" y="88" width="84" height="34" rx="8" fill="#fff"></rect></g><text x="594" y="110" text-anchor="middle">Text</text>
    <g filter="url(#sa-sh)"><rect x="644" y="88" width="84" height="34" rx="8" fill="#fff"></rect></g><text x="686" y="110" text-anchor="middle">Image</text>
    <g filter="url(#sa-sh)"><rect x="736" y="88" width="80" height="34" rx="8" fill="#fff"></rect></g><text x="776" y="110" text-anchor="middle">Audio</text>
    <g filter="url(#sa-sh)"><rect x="552" y="130" width="84" height="34" rx="8" fill="#fff"></rect></g><text x="594" y="152" text-anchor="middle">Video</text>
    <g filter="url(#sa-sh)"><rect x="644" y="130" width="172" height="34" rx="8" fill="#fff"></rect></g><text x="730" y="152" text-anchor="middle">Domain · legal, clinical…</text>
  </g>
  <text x="552" y="208" font-size="12" fill="#8a6fc0" font-style="italic">most QA orgs have no column for this yet</text>

  
  <g filter="url(#sa-sh)"><rect x="28" y="252" width="804" height="44" rx="13" fill="url(#sa-bar)"></rect></g>
  <text x="430" y="280" text-anchor="middle" font-size="14.5" font-weight="600" fill="#fff">The thing the business sells is now the output itself.</text>
</svg>