<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" aria-label="The QA you already know (user flows, stability, performance, security) is extended with a new expansion for testing model output: known-regression evals, metamorphic relations, adversarial probing, and live guardrails. Together they form one test strategy.">
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- LEFT CARD: the QA you already know -->
  <rect x="36" y="40" width="350" height="312" rx="14" fill="#f4f6fa" stroke="#cdd5e1"/>
  <rect x="36" y="40" width="350" height="46" rx="14" fill="#13283f"/>
  <rect x="36" y="64" width="350" height="22" fill="#13283f"/>
  <text x="60" y="70" font-size="15" font-weight="700" fill="#ffffff">The QA you already know</text>

  <g font-size="14.5" fill="#41506680">
    <rect x="60" y="104" width="302" height="44" rx="9" fill="#ffffff" stroke="#d4dbe6"/>
    <text x="80" y="131" fill="#415066">User flows</text>
    <rect x="60" y="158" width="302" height="44" rx="9" fill="#ffffff" stroke="#d4dbe6"/>
    <text x="80" y="185" fill="#415066">System stability</text>
    <rect x="60" y="212" width="302" height="44" rx="9" fill="#ffffff" stroke="#d4dbe6"/>
    <text x="80" y="239" fill="#415066">Performance</text>
    <rect x="60" y="266" width="302" height="44" rx="9" fill="#ffffff" stroke="#d4dbe6"/>
    <text x="80" y="293" fill="#415066">Security</text>
  </g>

  <!-- PLUS connector -->
  <circle cx="450" cy="196" r="30" fill="#ffffff" stroke="#7a4fd0" stroke-width="2.5"/>
  <line x1="450" y1="180" x2="450" y2="212" stroke="#7a4fd0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="434" y1="196" x2="466" y2="196" stroke="#7a4fd0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#7a4fd0" font-weight="600">extends</text>

  <!-- RIGHT CARD: the expansion (dashed = new) -->
  <rect x="514" y="40" width="350" height="312" rx="14" fill="#faf7ff" stroke="#7a4fd0" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="514" y="40" width="350" height="46" rx="14" fill="#5b34a8"/>
  <rect x="514" y="64" width="350" height="22" fill="#5b34a8"/>
  <text x="538" y="70" font-size="15" font-weight="700" fill="#ffffff">New: testing model output</text>
  <rect x="794" y="50" width="56" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="822" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">NEW</text>

  <g font-size="14.5" font-weight="600">
    <rect x="538" y="104" width="302" height="44" rx="9" fill="#eaf3ff"/>
    <rect x="538" y="104" width="6" height="44" rx="3" fill="#3a6ea5"/>
    <text x="560" y="131" fill="#1f3a5f">Known-regression evals</text>

    <rect x="538" y="158" width="302" height="44" rx="9" fill="#f3eeff"/>
    <rect x="538" y="158" width="6" height="44" rx="3" fill="#7a4fd0"/>
    <text x="560" y="185" fill="#3d2a6b">Metamorphic relations</text>

    <rect x="538" y="212" width="302" height="44" rx="9" fill="#fff4e6"/>
    <rect x="538" y="212" width="6" height="44" rx="3" fill="#d98a2b"/>
    <text x="560" y="239" fill="#a85f12">Adversarial probing</text>

    <rect x="538" y="266" width="302" height="44" rx="9" fill="#e7f6ef"/>
    <rect x="538" y="266" width="6" height="44" rx="3" fill="#1f9d6b"/>
    <text x="560" y="293" fill="#15734e">Live guardrails &amp; monitoring</text>
  </g>

  <!-- unifying bar: one strategy -->
  <rect x="36" y="392" width="828" height="46" rx="12" fill="#0f1b2d"/>
  <text x="450" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">It does not replace what you already test. It is one test strategy now.</text>
</svg>
