<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" font-family="Montserrat,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" aria-label="The QA you already know (user flows, stability, performance, security) is extended with a new expansion for testing model output: known-regression evals, metamorphic relations, adversarial probing, and live guardrails. Together they form one test strategy.">
  <defs>
    <linearGradient id="f2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#f7f9fc"></stop>
    </linearGradient>
    <linearGradient id="f2-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"></stop>
      <stop offset="1" stop-color="#eef2f8"></stop>
    </linearGradient>
    <linearGradient id="f2-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8ff"></stop>
      <stop offset="1" stop-color="#f4eeff"></stop>
    </linearGradient>
    <linearGradient id="f2-hdr-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3b5c"></stop>
      <stop offset="1" stop-color="#13283f"></stop>
    </linearGradient>
    <linearGradient id="f2-hdr-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b41bf"></stop>
      <stop offset="1" stop-color="#5b34a8"></stop>
    </linearGradient>
    <linearGradient id="f2-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13283f"></stop>
      <stop offset="1" stop-color="#0f1b2d"></stop>
    </linearGradient>
    <filter id="f2-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#13283f" flood-opacity="0.12"></feDropShadow>
    </filter>
    <filter id="f2-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#13283f" flood-opacity="0.10"></feDropShadow>
    </filter>
    <clipPath id="f2-clipL"><rect x="36" y="40" width="350" height="312" rx="16"></rect></clipPath>
    <clipPath id="f2-clipR"><rect x="514" y="40" width="350" height="312" rx="16"></rect></clipPath>
  </defs>

  <rect width="900" height="470" fill="url(#f2-bg)"></rect>

  
  <g filter="url(#f2-shadow)">
    <rect x="36" y="40" width="350" height="312" rx="16" fill="url(#f2-left)" stroke="#cdd5e1"></rect>
  </g>
  <g clip-path="url(#f2-clipL)">
    <rect x="36" y="40" width="350" height="50" fill="url(#f2-hdr-l)"></rect>
  </g>
  <text x="60" y="71" font-size="15" font-weight="700" fill="#ffffff">The QA you already know</text>

  <g font-size="14">
    <g filter="url(#f2-soft)"><rect x="60" y="108" width="302" height="44" rx="10" fill="#ffffff" stroke="#dde4ee"></rect></g>
    <circle cx="84" cy="130" r="4" fill="#48607c"></circle><text x="100" y="135" fill="#3c4d63" font-weight="600">User flows</text>
    <g filter="url(#f2-soft)"><rect x="60" y="160" width="302" height="44" rx="10" fill="#ffffff" stroke="#dde4ee"></rect></g>
    <circle cx="84" cy="182" r="4" fill="#48607c"></circle><text x="100" y="187" fill="#3c4d63" font-weight="600">System stability</text>
    <g filter="url(#f2-soft)"><rect x="60" y="212" width="302" height="44" rx="10" fill="#ffffff" stroke="#dde4ee"></rect></g>
    <circle cx="84" cy="234" r="4" fill="#48607c"></circle><text x="100" y="239" fill="#3c4d63" font-weight="600">Performance</text>
    <g filter="url(#f2-soft)"><rect x="60" y="264" width="302" height="44" rx="10" fill="#ffffff" stroke="#dde4ee"></rect></g>
    <circle cx="84" cy="286" r="4" fill="#48607c"></circle><text x="100" y="291" fill="#3c4d63" font-weight="600">Security</text>
  </g>

  
  <g filter="url(#f2-shadow)">
    <circle cx="450" cy="196" r="32" fill="#ffffff" stroke="#7a4fd0" stroke-width="2.5"></circle>
  </g>
  <line x1="450" y1="180" x2="450" y2="212" stroke="#7a4fd0" stroke-width="4" stroke-linecap="round"></line>
  <line x1="434" y1="196" x2="466" y2="196" stroke="#7a4fd0" stroke-width="4" stroke-linecap="round"></line>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#7a4fd0" font-weight="700" letter-spacing="0.5">extends</text>

  
  <g filter="url(#f2-shadow)">
    <rect x="514" y="40" width="350" height="312" rx="16" fill="url(#f2-right)" stroke="#7a4fd0" stroke-width="2" stroke-dasharray="8 6"></rect>
  </g>
  <g clip-path="url(#f2-clipR)">
    <rect x="514" y="40" width="350" height="50" fill="url(#f2-hdr-r)"></rect>
  </g>
  <text x="538" y="71" font-size="15" font-weight="700" fill="#ffffff">New: testing model output</text>
  <rect x="792" y="51" width="58" height="28" rx="14" fill="#ffffff" fill-opacity="0.22"></rect>
  <text x="821" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">NEW</text>

  <g font-size="13.5" font-weight="600">
    <g filter="url(#f2-soft)"><rect x="538" y="108" width="302" height="44" rx="10" fill="#eaf3ff"></rect></g>
    <rect x="538" y="108" width="7" height="44" rx="3.5" fill="#3a6ea5"></rect>
    <text x="562" y="135" fill="#1f3a5f">Known-regression evals</text>

    <g filter="url(#f2-soft)"><rect x="538" y="160" width="302" height="44" rx="10" fill="#f3eeff"></rect></g>
    <rect x="538" y="160" width="7" height="44" rx="3.5" fill="#7a4fd0"></rect>
    <text x="562" y="187" fill="#3d2a6b">Metamorphic relations</text>

    <g filter="url(#f2-soft)"><rect x="538" y="212" width="302" height="44" rx="10" fill="#fff4e6"></rect></g>
    <rect x="538" y="212" width="7" height="44" rx="3.5" fill="#d98a2b"></rect>
    <text x="562" y="239" fill="#a85f12">Adversarial probing</text>

    <g filter="url(#f2-soft)"><rect x="538" y="264" width="302" height="44" rx="10" fill="#e7f6ef"></rect></g>
    <rect x="538" y="264" width="7" height="44" rx="3.5" fill="#1f9d6b"></rect>
    <text x="562" y="291" fill="#15734e">Live guardrails &amp; monitoring</text>
  </g>

  
  <g filter="url(#f2-shadow)">
    <rect x="36" y="396" width="828" height="48" rx="14" fill="url(#f2-bar)"></rect>
  </g>
  <text x="450" y="425" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">It does not replace what you already test. It is one test strategy now.</text>
</svg>