<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1830"/><stop offset="0.5" stop-color="#13233f"/><stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#3f72ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6b3fd0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6b3fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26374f"/><stop offset="1" stop-color="#0d1828"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3450"/><stop offset="1" stop-color="#241f38"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cda4"/><stop offset="1" stop-color="#e7ad7e"/></linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43568c"/><stop offset="1" stop-color="#293765"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea2ff"/><stop offset="1" stop-color="#4a63ff"/></linearGradient>
    <linearGradient id="avatarbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4e3ff"/><stop offset="1" stop-color="#aec7ff"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4fd0"/><stop offset="1" stop-color="#4a63ff"/></linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5fb"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2742"/><stop offset="1" stop-color="#0c1426"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050b1c" flood-opacity="0.45"/></filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a1426" flood-opacity="0.28"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title -->
  <text x="70" y="190" font-size="50" font-weight="800" fill="#ffffff">
    <tspan x="70" dy="0">When the test matrix</tspan>
    <tspan x="70" dy="64">has to cover</tspan>
    <tspan x="70" dy="64">the AI model</tspan>
  </text>
  <text x="72" y="372" font-size="22" fill="#9fb2c9">A QA take on scoring what the AI model produces.</text>
  <rect x="72" y="528" width="44" height="44" rx="10" fill="#5b8cff" fill-opacity="0.15" stroke="#5b8cff" stroke-opacity="0.5"/>
  <text x="94" y="558" text-anchor="middle" font-size="22" font-weight="800" fill="#9db8ff">A</text>
  <text x="132" y="548" font-size="24" font-weight="700" fill="#ffffff">an-li.tw</text>
  <text x="132" y="574" font-size="17" fill="#7e90a6">An Li · QA &amp; AI testing</text>

  <!-- ===== illustration ===== -->
  <g transform="translate(640,108) scale(0.80)">
    <ellipse cx="430" cy="215" rx="320" ry="250" fill="url(#glow)"/>
    <!-- desk -->
    <rect x="-60" y="404" width="760" height="90" fill="url(#desk)"/>
    <rect x="-60" y="404" width="760" height="3" fill="#33507e" opacity="0.5"/>

    <!-- monitor -->
    <ellipse cx="450" cy="392" rx="125" ry="16" fill="#050c18" opacity="0.55"/>
    <rect x="440" y="330" width="22" height="48" fill="url(#frame)"/>
    <rect x="398" y="374" width="108" height="14" rx="7" fill="url(#frame)"/>
    <rect x="300" y="62" width="300" height="276" rx="18" fill="url(#frame)" filter="url(#sh)"/>
    <rect x="315" y="78" width="270" height="244" rx="9" fill="url(#screen)"/>
    <!-- chat header -->
    <circle cx="336" cy="102" r="5" fill="#ff5f57"/><circle cx="353" cy="102" r="5" fill="#febc2e"/><circle cx="370" cy="102" r="5" fill="#28c840"/>
    <text x="568" y="107" font-size="11" fill="#9aa7b8" text-anchor="end">AI assistant</text>
    <line x1="315" y1="120" x2="585" y2="120" stroke="#eef1f5" stroke-width="2"/>
    <!-- user bubble -->
    <rect x="402" y="136" width="166" height="32" rx="12" fill="url(#accent)" filter="url(#sh2)"/>
    <text x="558" y="157" font-size="12" fill="#ffffff" text-anchor="end">make me an avatar</text>
    <!-- bot reply with generated avatar -->
    <rect x="330" y="182" width="240" height="124" rx="12" fill="#ffffff" stroke="#eef1f5" filter="url(#sh2)"/>
    <circle cx="372" cy="228" r="29" fill="url(#avatarbg)" stroke="#5b8cff" stroke-width="2"/>
    <clipPath id="av"><circle cx="372" cy="228" r="29"/></clipPath>
    <g clip-path="url(#av)">
      <circle cx="372" cy="222" r="12" fill="url(#skin)"/>
      <path d="M356 220 q16 -20 32 0 q2 -18 -16 -18 q-18 0 -16 18 Z" fill="url(#hair)"/>
      <path d="M350 262 q22 -22 44 0 L394 268 q-22 8 -44 0 Z" fill="#6e86c8"/>
    </g>
    <rect x="414" y="214" width="128" height="8" rx="4" fill="#cdd8e8"/>
    <rect x="414" y="230" width="96" height="8" rx="4" fill="#cdd8e8"/>
    <rect x="346" y="270" width="208" height="8" rx="4" fill="#dde4ee"/>
    <rect x="346" y="286" width="150" height="8" rx="4" fill="#dde4ee"/>

    <!-- person (back 3/4 view) -->
    <g filter="url(#sh)">
      <path d="M64 470 C64 356 104 332 150 332 C196 332 236 356 236 470 Z" fill="url(#hoodie)"/>
    </g>
    <ellipse cx="150" cy="338" rx="54" ry="22" fill="#222e52"/>
    <rect x="138" y="300" width="24" height="28" rx="9" fill="url(#skin)"/>
    <circle cx="150" cy="284" r="47" fill="url(#hair)"/>
    <ellipse cx="184" cy="290" rx="15" ry="27" fill="url(#skin)"/>
    <ellipse cx="172" cy="290" rx="6" ry="9" fill="#e7ad7e"/>
    <path d="M104 282 q46 -64 92 0 q-46 -28 -92 0 Z" fill="url(#hair)"/>
    <!-- arm to desk -->
    <path d="M206 392 C252 378 300 390 326 404 L320 420 C296 410 250 404 206 416 Z" fill="url(#hoodie)"/>
    <ellipse cx="326" cy="410" rx="15" ry="11" fill="url(#skin)"/>

    <!-- thought bubble with score gauge -->
    <circle cx="150" cy="236" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="138" cy="212" r="9" fill="#ffffff" opacity="0.92"/>
    <circle cx="122" cy="184" r="12" fill="#ffffff" opacity="0.95"/>
    <g filter="url(#sh)">
      <rect x="6" y="16" width="244" height="134" rx="36" fill="url(#bubble)"/>
      <ellipse cx="40" cy="146" rx="18" ry="13" fill="#f3f5fb"/>
    </g>
    <circle cx="66" cy="86" r="27" fill="none" stroke="#e7ebf3" stroke-width="9"/>
    <circle cx="66" cy="86" r="27" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-dasharray="134 170" transform="rotate(-90 66 86)"/>
    <text x="66" y="92" text-anchor="middle" font-size="17" font-weight="800" fill="#13283f">x</text>
    <text x="108" y="72" font-size="13" fill="#7e90a6">scoring the output</text>
    <text x="108" y="106" font-size="30" font-weight="800" fill="#13283f"><tspan fill="#7a4fd0">x</tspan>/100</text>
    <text x="218" y="54" font-size="24" font-weight="700" fill="#d98a2b">?</text>

    <!-- ambient sparkles -->
    <circle cx="300" cy="40" r="3" fill="#9db8ff" opacity="0.8"/>
    <circle cx="612" cy="150" r="4" fill="#caa9ff" opacity="0.7"/>
    <circle cx="590" cy="350" r="3" fill="#6ea2ff" opacity="0.7"/>
  </g>
</svg>
