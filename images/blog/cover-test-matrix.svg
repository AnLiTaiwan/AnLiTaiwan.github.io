<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" aria-label="A person at a desk looking at a chat screen where an AI bot has replied with a generated avatar image. A thought bubble above the person shows a quality score, x out of 100, being decided.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="0.45" stop-color="#13283f"/>
      <stop offset="1" stop-color="#1c1230"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>

  <!-- illustration: person scoring an AI chat output (subtle, behind the centered title) -->
  <g transform="translate(965,30)" opacity="0.5">
    <!-- thought bubble -->
    <g>
      <circle cx="135" cy="205" r="12" fill="#ffffff" opacity="0.95"/>
      <circle cx="152" cy="232" r="9" fill="#ffffff" opacity="0.9"/>
      <circle cx="168" cy="255" r="6" fill="#ffffff" opacity="0.85"/>
      <rect x="20" y="70" width="232" height="120" rx="34" fill="#ffffff"/>
      <ellipse cx="48" cy="182" rx="20" ry="15" fill="#ffffff"/>
      <text x="46" y="112" font-size="15" fill="#7e90a6">scoring the output</text>
      <text x="46" y="160" font-size="42" font-weight="800" fill="#13283f"><tspan fill="#7a4fd0">x</tspan> / 100</text>
      <text x="206" y="112" font-size="28" font-weight="700" fill="#d98a2b">?</text>
    </g>

    <!-- person (back view at the desk) -->
    <g>
      <path d="M78 470 Q78 372 150 372 Q222 372 222 470 Z" fill="#2b3a52"/>
      <circle cx="150" cy="318" r="44" fill="#34435e"/>
    </g>

    <!-- monitor -->
    <g>
      <rect x="402" y="368" width="18" height="40" fill="#2b3a52"/>
      <rect x="360" y="404" width="104" height="14" rx="6" fill="#2b3a52"/>
      <rect x="255" y="64" width="330" height="304" rx="16" fill="#0b1422" stroke="#46587a" stroke-width="2"/>
      <rect x="271" y="80" width="298" height="272" rx="8" fill="#ffffff"/>
      <!-- chat header -->
      <circle cx="293" cy="104" r="5" fill="#ff5f57"/>
      <circle cx="311" cy="104" r="5" fill="#febc2e"/>
      <circle cx="329" cy="104" r="5" fill="#28c840"/>
      <text x="556" y="109" font-size="12" fill="#9aa7b8" text-anchor="end">AI assistant</text>
      <line x1="271" y1="122" x2="569" y2="122" stroke="#eef1f5" stroke-width="2"/>
      <!-- user prompt bubble -->
      <rect x="372" y="140" width="182" height="34" rx="12" fill="#5b8cff"/>
      <text x="546" y="162" font-size="12.5" fill="#ffffff" text-anchor="end">make me an avatar</text>
      <!-- bot reply bubble with generated avatar -->
      <rect x="286" y="190" width="268" height="150" rx="12" fill="#f1f4f8"/>
      <circle cx="332" cy="240" r="30" fill="#dbe7ff" stroke="#5b8cff" stroke-width="2"/>
      <circle cx="332" cy="232" r="11" fill="#5b8cff"/>
      <path d="M313 259 Q332 240 351 259 Q332 270 313 259 Z" fill="#5b8cff"/>
      <rect x="376" y="222" width="150" height="9" rx="4" fill="#c7d2e0"/>
      <rect x="376" y="240" width="116" height="9" rx="4" fill="#c7d2e0"/>
      <rect x="304" y="298" width="226" height="9" rx="4" fill="#dde4ee"/>
      <rect x="304" y="315" width="176" height="9" rx="4" fill="#dde4ee"/>
    </g>
  </g>
</svg>
