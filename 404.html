    <script src="js/i18n-data.js"></script>
    <script>
    (function () {
        function applyHTML(lang) {
            const dict = window.I18N[lang] || window.I18N.en;
            document.querySelectorAll("[data-i18n-html]").forEach(el => {
                const key = el.getAttribute("data-i18n-html");
                const val = key.split(".").reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), dict);
                if (typeof val === "string") el.innerHTML = val;
            });
            if (dict.notFound && dict.notFound.pageTitle) {
                document.title = dict.notFound.pageTitle;
            }
        }
        function run() {
            if (!window.I18N || !window.I18nRuntime) return;
            applyHTML(window.I18nRuntime.getLang());
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", run);
        } else { run(); }
        window.addEventListener("i18n:change", (e) => applyHTML(e.detail.lang));
    })();
    </script>
